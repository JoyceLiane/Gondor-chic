<div class="page-wrapper">
  <div class="parchment-container">

    <div class="seal">
      <img src="logo.png" alt="Gondor Chic" class="seal-img" />
    </div>

    <h1 class="title">Magic VentesStock</h1>

    <div class="subtitle-wrapper" style="text-align: center; width: 100%;">
      <p class="welcome-message">Bienvenue, <span class="client-name">{{ authService.displayName }}</span></p>
      <div class="divider-ornament">
        <span class="divider-line-left"></span>
        <span class="divider-symbol">&#10040;</span>
        <span class="divider-line-right"></span>
      </div>
    </div>

    <div class="product-layout" *ngIf="authService.produitDuJour as produitDuJour">
      <div class="product-image-container">
        <img [src]="'./assets/img/' + produitDuJour.image" [alt]="produitDuJour.libelle" class="product-img" />
      </div>

      <div class="product-details">
        <h3 class="product-title">Produit du jour</h3>
        <p class="product-name">{{ produitDuJour.libelle }}</p>

        <div class="product-meta">
          <div class="meta-box">
            <span class="label">PRIX</span>
            <span class="value">{{ produitDuJour.prix_gar }} GAr</span>
          </div>
          <div class="meta-box">
            <span class="label">STOCK</span>
            <span class="value">{{ produitDuJour.quantite_stock }} PIÈCES</span>
          </div>
        </div>

        <div class="action-zone">
          <div class="quantity-wrapper">
            <div class="quantity-selector">
              <button type="button" class="qty-btn" (click)="decreaseQuantity()">
                <img src="/icons/-.png" alt="Moins" />
              </button>
              <input type="number" class="qty-input" [value]="quantity" min="1" readonly />
              <button type="button" class="qty-btn" (click)="increaseQuantity(produitDuJour.quantite_stock)">
                <img src="/icons/+.png" alt="Plus" />
              </button>
            </div>
          </div>

          <div class="cart-btn-wrapper">
            <button type="button" class="btn-add-cart">
              <img src="/icons/add-to-card.png" alt="Ajouter au Panier" />
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="no-product" *ngIf="!authService.produitDuJour">
      <p>Pas de produit du jour disponible.</p>
    </div>

    <!-- <p class="footer-text">"Élégance et Tradition"</p> -->

  </div>
</div>
