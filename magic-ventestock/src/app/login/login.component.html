<div class="page-wrapper">
  <div class="parchment-container">
    <!-- Coins ornementaux SVG -->
    <svg class="corner corner-tl" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54">
      <path d="M 7 47 C 7 25 25 7 47 7" stroke="#8b5e3c" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <line x1="4" y1="47" x2="10" y2="47" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" />
      <line x1="47" y1="4" x2="47" y2="10" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" />
    </svg>
    <svg class="corner corner-tr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54">
      <path d="M 7 47 C 7 25 25 7 47 7" stroke="#8b5e3c" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <line x1="4" y1="47" x2="10" y2="47" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" />
      <line x1="47" y1="4" x2="47" y2="10" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" />
    </svg>
    <svg class="corner corner-bl" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54">
      <path d="M 7 47 C 7 25 25 7 47 7" stroke="#8b5e3c" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <line x1="4" y1="47" x2="10" y2="47" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" />
      <line x1="47" y1="4" x2="47" y2="10" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" />
    </svg>
    <svg class="corner corner-br" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54">
      <path d="M 7 47 C 7 25 25 7 47 7" stroke="#8b5e3c" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <line x1="4" y1="47" x2="10" y2="47" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" />
      <line x1="47" y1="4" x2="47" y2="10" stroke="#8b5e3c" stroke-width="1.5" stroke-linecap="round" />
    </svg>

    <!-- Sceau -->
    <div class="seal">
      <img src="logo.png" alt="Gondor Chic" class="seal-img" />
    </div>

    <!-- Titre -->
    <h1 class="title">Magic VentesStock</h1>

    <!-- Sous-titre avec séparateurs -->
    <div class="subtitle-wrapper">
      <p class="subtitle">"Bienvenue dans les contrées de Gondor Chic"</p>
      <div class="divider-ornament">&#10038;</div>
    </div>

    <!-- Formulaire -->
    <form class="login-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="pseudo">Pseudo</label>
        <input id="pseudo" type="text" name="pseudo" [(ngModel)]="pseudo" autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="motDePasse">Mot de passe</label>
        <input id="motDePasse" type="password" name="motDePasse" [(ngModel)]="motDePasse"
          autocomplete="current-password" />
      </div>

      <button type="submit" class="btn-login">S'identifier</button>
    </form>

    <!-- Pied de page -->
    <p class="footer-text">"Élégance et Tradition"</p>

  </div>
</div>
